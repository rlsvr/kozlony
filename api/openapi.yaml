openapi: "3.0.3"
info:
  title: Message Board API
  description: High-performance message board API with JetStream ingestion and PostgreSQL persistence.
  version: "0.1.0"

servers:
  - url: http://localhost:8080
    description: Local development

paths:
  /v1/healthz:
    get:
      summary: Liveness probe
      description: Returns 200 as long as the HTTP process is alive.
      operationId: GetHealthz
      tags:
        - Health
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /v1/readyz:
    get:
      summary: Readiness probe
      description: Returns 200 when downstream dependencies (NATS, PostgreSQL) are connected.
      operationId: GetReadyz
      tags:
        - Health
      responses:
        "200":
          description: Service is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Service is not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /v1/interactions:
    post:
      summary: Create an interaction
      description: Creates a new post (with title) or a reply to an existing interaction (without title).
      operationId: CreateInteraction
      tags:
        - Interactions
      parameters:
        - name: Idempotency-Key
          in: header
          description: >-
            Client-provided idempotency key used to derive a deterministic interaction ID.
            Retries with the same key return the existing interaction (200 OK) instead of creating a duplicate.
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInteractionRequest"
      responses:
        "200":
          description: Idempotent replay of an existing interaction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Interaction"
        "201":
          description: Interaction created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Interaction"
        "400":
          description: Invalid input.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Parent interaction not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      summary: List root interactions (Feed)
      description: Returns a paginated list of root message board posts in a group, ordered descending by creation time.
      operationId: ListInteractions
      tags:
        - Interactions
      parameters:
        - name: group_id
          in: query
          description: Board/Group identifier (defaults to root).
          required: false
          schema:
            type: string
            default: "root"
        - name: limit
          in: query
          description: Maximum number of interactions to return.
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          description: Cursor timestamp for scrollback pagination.
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Feed of interactions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InteractionFeedResponse"

  /v1/interactions/{id}:
    get:
      summary: Get interaction with replies
      description: Returns an individual interaction along with its full conversation tree of replies.
      operationId: GetInteraction
      tags:
        - Interactions
      parameters:
        - name: id
          in: path
          description: Interaction UUID.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Interaction details with full reply thread.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InteractionDetail"
        "404":
          description: Interaction not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      summary: Edit an interaction
      description: Updates the title (optional, root posts only) and body of an interaction with optimistic concurrency version check.
      operationId: UpdateInteraction
      tags:
        - Interactions
      parameters:
        - name: id
          in: path
          description: Interaction UUID.
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInteractionRequest"
      responses:
        "200":
          description: Interaction updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Interaction"
        "400":
          description: Invalid input or missing fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Interaction not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Version conflict (interaction was modified by another client).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/interactions/events:
    get:
      summary: Stream interactions
      description: >-
        Server-Sent Events (SSE) endpoint broadcasting new interactions, edits, and
        recalculated reply counts in real-time.
      operationId: EventsInteractions
      tags:
        - Interactions
      parameters:
        - name: group_id
          in: query
          description: Optional board/group filter.
          required: false
          schema:
            type: string
        - name: root_id
          in: query
          description: Optional thread root UUID filter. When set, client only receives events belonging to this conversation tree.
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: >-
            SSE text/event-stream of serialized JSON events (data: <event>\n\n) or :ping heartbeats.
            Events emitted correspond to InteractionCreatedEvent, InteractionEditedEvent, or
            ReplyCountsRecalculatedEvent.
          content:
            text/event-stream:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/InteractionCreatedEvent"
                  - $ref: "#/components/schemas/InteractionEditedEvent"
                  - $ref: "#/components/schemas/ReplyCountsRecalculatedEvent"

components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: "post not found"

    CreateInteractionRequest:
      type: object
      required:
        - body
        - author
      properties:
        group_id:
          type: string
          default: "root"
          maxLength: 64
          description: Board/Group identifier.
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: Null for root posts; points to immediate parent for replies.
        title:
          type: string
          nullable: true
          minLength: 1
          maxLength: 255
          description: Title for root posts; omitted or null for replies.
        body:
          type: string
          minLength: 1
          maxLength: 65535
          description: Markdown/text content of the post or reply.
        author:
          type: string
          minLength: 1
          maxLength: 100
          description: Username or display name of the author.

    UpdateInteractionRequest:
      type: object
      required:
        - body
        - version
      properties:
        title:
          type: string
          nullable: true
          minLength: 1
          maxLength: 255
          description: Updated title for root posts; null or omitted for replies.
        body:
          type: string
          minLength: 1
          maxLength: 65535
          description: Updated markdown/text content.
        version:
          type: integer
          minimum: 1
          description: Current version for optimistic concurrency control.

    Interaction:
      type: object
      required:
        - id
        - group_id
        - body
        - author
        - created_at
        - reply_count
        - depth
        - version
      properties:
        id:
          type: string
          format: uuid
          description: Time-ordered UUIDv7 identifier.
        group_id:
          type: string
          maxLength: 64
          example: "root"
        root_id:
          type: string
          format: uuid
          nullable: true
          description: Null for root posts; points to the conversation thread root.
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: Null for root posts; points to immediate parent interaction.
        title:
          type: string
          nullable: true
          maxLength: 255
          example: "Welcome to the Message Board"
        body:
          type: string
          maxLength: 65535
          example: "This is the body content."
        author:
          type: string
          maxLength: 100
          example: "Alice"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true
        reply_count:
          type: integer
          default: 0
        depth:
          type: integer
          default: 0
          description: Nesting depth (0 = root post, 1 = direct reply, 2+ = nested).
        version:
          type: integer
          minimum: 1
          default: 1
          example: 1
          description: Version number for optimistic concurrency control.

    InteractionFeedResponse:
      type: object
      required:
        - interactions
      properties:
        interactions:
          type: array
          items:
            $ref: "#/components/schemas/Interaction"
        next_cursor:
          type: string
          format: date-time
          nullable: true
          description: Cursor to pass as cursor query param for subsequent page.

    InteractionDetail:
      type: object
      required:
        - interaction
        - replies
      properties:
        interaction:
          $ref: "#/components/schemas/Interaction"
        replies:
          type: array
          items:
            $ref: "#/components/schemas/Interaction"

    InteractionCreatedEvent:
      type: object
      description: Event emitted and streamed via SSE when a post or reply is created.
      required:
        - id
        - group_id
        - body
        - author
        - created_at
        - reply_count
        - depth
        - version
      properties:
        id:
          type: string
          format: uuid
        group_id:
          type: string
          maxLength: 64
        root_id:
          type: string
          format: uuid
          nullable: true
        parent_id:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
          nullable: true
          maxLength: 255
        body:
          type: string
          maxLength: 65535
        author:
          type: string
          maxLength: 100
        created_at:
          type: string
          format: date-time
        reply_count:
          type: integer
        depth:
          type: integer
        version:
          type: integer

    InteractionEditedEvent:
      type: object
      description: Event emitted and streamed via SSE when an interaction is edited.
      required:
        - id
        - group_id
        - body
        - version
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        group_id:
          type: string
          maxLength: 64
        title:
          type: string
          nullable: true
          maxLength: 255
        body:
          type: string
          maxLength: 65535
        version:
          type: integer
          minimum: 2
        updated_at:
          type: string
          format: date-time

    ReplyCountsRecalculatedEvent:
      type: object
      description: Event emitted after a batch commits and streamed via SSE, carrying absolute reply counts.
      required:
        - group_id
        - counts
      properties:
        group_id:
          type: string
          maxLength: 64
        counts:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
